name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install & Build Web
        run: |
          pnpm install
          pnpm --filter @workspace/3d-game run build

      - name: Sync Capacitor
        run: |
          cd artifacts/3d-game
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK (debug)
        run: |
          cd artifacts/3d-game/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: planet-evolution-debug
          path: artifacts/3d-game/android/app/build/outputs/apk/debug/app-debug.apk
